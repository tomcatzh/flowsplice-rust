[package]
name = "flowsplice-travel-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow.workspace = true
flowsplice-travel-core = { workspace = true, default-features = false }
flowsplice-core.workspace = true
jni = "0.22.4"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[lints.rust]
# This crate is the single audited FFI boundary. The reusable Travel Core remains `forbid`.
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
