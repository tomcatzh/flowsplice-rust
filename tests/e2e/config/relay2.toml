id = "relay-2"
management_listen = "0.0.0.0:8443"
data_listen = "0.0.0.0:8444"
data_public_addr = "relay2:8444"
server_data_addr = "server:7444"
server_id = "server-1"
cert = "/certs/relay2.crt"
key = "/certs/relay2.key"
management_ca = "/certs/management-ca.crt"
server_spki_pins = ["__SERVER_PIN__"]
travel_authorization_cache = "/state/relay2-authorization-cache.json"
handshake_timeout_secs = 10
route_ttl_secs = 15

[[travel_authorities]]
kind = "home"
id = "home-1-authority"
home_id = "home-1"
public_key = "__HOME1_AUTHORITY_PUBLIC_KEY__"

[[travel_authorities]]
kind = "home"
id = "home-2-authority"
home_id = "home-2"
public_key = "__HOME2_AUTHORITY_PUBLIC_KEY__"

[[travel_authorities]]
kind = "global"
id = "operator-global-authority"
home_id = "home-1"
public_key = "__GLOBAL_AUTHORITY_PUBLIC_KEY__"
