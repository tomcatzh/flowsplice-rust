id = "relay-2"
connection_mode = "active"
management_listen = "0.0.0.0:8443"
data_listen = "0.0.0.0:8444"
server_id = "server-1"
server_control_addr = "server:7443"
cert = "/certs/relay2.crt"
key = "/certs/relay2.key"
management_ca = "/certs/management-ca.crt"
deployment_root_public_key = "/certs/deployment-root.pub"
deployment_trust = "/certs/deployment-trust.json"
server_spki_pins = ["__SERVER_PIN__"]
travel_authorization_cache = "/state/relay2-authorization-cache.json"
state_store = "/state/relay2-state.redb"
ui_listen = "127.0.0.1:9084"
handshake_timeout_secs = 10
route_ttl_secs = 15
