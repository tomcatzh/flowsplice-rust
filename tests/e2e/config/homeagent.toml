id = "home-1"
alias = "E2E Home"
server_control_addr = "server:7443"
server_name = "server.flowsplice"
server_id = "server-1"
management_cert = "/certs/home-management.crt"
management_key = "/certs/home-management.key"
management_ca = "/certs/management-ca.crt"
business_cert = "/certs/home-business.crt"
business_key = "/certs/home-business.key"
business_ca = "/certs/business-ca.crt"
deployment_root_public_key = "/certs/deployment-root.pub"
deployment_trust = "/certs/deployment-trust.json"
server_spki_pins = ["__SERVER_PIN__"]
travel_authorization_cache = "/state/home-authorization-cache.json"
state_store = "/state/home-state.redb"
ui_listen = "0.0.0.0:9081"
handshake_timeout_secs = 10
udp_idle_secs = 10
carrier_heartbeat_secs = 2
carrier_timeout_secs = 15
flow_detach_timeout_secs = 60
max_unacked_bytes = 1048576

[issuer]
management_ca_key = "/issuer/management-ca.key"
business_ca_key = "/issuer/business-ca.key"
default_valid_days = 365
test_allow_remote_listen = true
test_admin_token = "flowsplice-e2e-home-issuer-administrator-token"

[issuer.home_authority]
id = "home-1-authority"
private_key = "/issuer/home1-authority.key"

[issuer.global_authority]
id = "operator-global-authority"
private_key = "/issuer/global-authority.key"

[issuer.home_enrollment_authority]
id = "operator-home-enrollment-authority"
private_key = "/issuer/home-enrollment-authority.key"

[[services]]
id = "tcp-echo"
alias = "TCP Echo"
protocol = "tcp"
target = "echo:7001"

[[services]]
id = "udp-echo"
alias = "UDP Echo"
protocol = "udp"
target = "echo:7002"

[[services]]
id = "home-1-only"
alias = "Home One Only"
protocol = "tcp"
target = "echo:7001"

[[services]]
id = "target-failure"
alias = "Unavailable Target"
protocol = "tcp"
target = "127.0.0.1:65530"
