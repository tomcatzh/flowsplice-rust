id = "travel-1"
deployment_root_public_key = "/travel/cert/deployment-root.pub"
deployment_trust = "/travel/cert/deployment-trust.json"
management_cert = "/travel/cert/travel-management.crt"
management_key = "/travel/cert/travel-management.key"
management_ca = "/travel/cert/management-ca.crt"
business_cert = "/travel/cert/travel-business.crt"
business_key = "/travel/cert/travel-business.key"
business_ca = "/travel/cert/business-ca.crt"
state_store = "/state/travel-state.redb"
enrollment_work_dir = "/state/travel-enrollment"
ui_listen = "0.0.0.0:9080"
test_allow_remote_listen = true
test_admin_token = "flowsplice-e2e-administrator-token"
handshake_timeout_secs = 10
udp_idle_secs = 10
max_active_flows = 128
carrier_heartbeat_secs = 1
carrier_timeout_secs = 4
carrier_race_timeout_secs = 5
carrier_recovery_timeout_secs = 40
carrier_reevaluate_secs = 2
max_carrier_reevaluate_secs = 4
max_unacked_bytes = 1048576

[[homes]]
id = "home-1"

[[homes]]
id = "home-2"

[[seed_relays]]
management_addr = "relay1:8443"

[[mappings]]
home_id = "home-1"
service_id = "tcp-echo"
protocol = "tcp"
bind = "0.0.0.0:10080"

[[mappings]]
home_id = "home-1"
service_id = "udp-echo"
protocol = "udp"
bind = "0.0.0.0:10081"

[[mappings]]
home_id = "home-2"
service_id = "tcp-echo"
protocol = "tcp"
bind = "0.0.0.0:10082"

[[mappings]]
home_id = "home-2"
service_id = "home-1-only"
protocol = "tcp"
bind = "0.0.0.0:10083"

[[mappings]]
home_id = "home-1"
service_id = "target-failure"
protocol = "tcp"
bind = "0.0.0.0:10084"

[[mappings]]
home_id = "home-2"
service_id = "target-failure"
protocol = "tcp"
bind = "0.0.0.0:10085"
