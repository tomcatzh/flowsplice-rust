id = "home-2"
alias = "E2E Home Two"
server_control_addr = "server:7443"
server_data_addr = "server:7444"
server_name = "server.flowsplice"
server_id = "server-1"
management_cert = "/certs/home2-management.crt"
management_key = "/certs/home2-management.key"
management_ca = "/certs/management-ca.crt"
business_cert = "/certs/home2-business.crt"
business_key = "/certs/home2-business.key"
business_ca = "/certs/business-ca.crt"
server_spki_pins = ["__SERVER_PIN__"]
travel_authority_public_key = "__TRAVEL_AUTHORITY_PUBLIC_KEY__"
travel_authorization_cache = "/state/home2-authorization-cache.json"
handshake_timeout_secs = 10
udp_idle_secs = 10
carrier_heartbeat_secs = 2
carrier_timeout_secs = 15
flow_detach_timeout_secs = 60
max_unacked_bytes = 1048576

[[services]]
id = "tcp-echo"
alias = "TCP Echo"
protocol = "tcp"
target = "echo2:7001"
