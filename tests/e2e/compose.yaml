services:
  echo:
    image: flowsplice-e2e:local
    command: ["/usr/local/bin/flowsplice-echo"]
    networks: [flowsplice]

  relay1:
    image: flowsplice-e2e:local
    command: ["/usr/local/bin/flowsplice-relay", "--config", "/config/relay.toml"]
    environment:
      RUST_LOG: flowsplice_relay=debug,info
    volumes:
      - ./generated/config:/config:ro
      - ./generated/certs:/certs:ro
      - ./generated/state:/state
    ports:
      - "127.0.0.1:18443:8443"
    networks: [flowsplice]

  relay2:
    image: flowsplice-e2e:local
    command: ["/usr/local/bin/flowsplice-relay", "--config", "/config/relay2.toml"]
    environment:
      RUST_LOG: flowsplice_relay=debug,info
    volumes:
      - ./generated/config:/config:ro
      - ./generated/certs:/certs:ro
      - ./generated/state:/state
    ports:
      - "127.0.0.1:28443:8443"
    networks: [flowsplice]

  server:
    image: flowsplice-e2e:local
    command: ["/usr/local/bin/flowsplice-server", "--config", "/config/server.toml"]
    environment:
      RUST_LOG: flowsplice_server=debug,info
    depends_on: [relay1, relay2]
    volumes:
      - ./generated/config:/config:ro
      - ./generated/certs:/certs:ro
      - ./generated/authorization:/authorization:ro
      - ./generated/state:/state
    networks: [flowsplice]

  homeagent:
    image: flowsplice-e2e:local
    command: ["/usr/local/bin/flowsplice-homeagent", "--config", "/config/homeagent.toml"]
    environment:
      RUST_LOG: flowsplice_homeagent=debug,info
    depends_on: [server, echo]
    volumes:
      - ./generated/config:/config:ro
      - ./generated/certs:/certs:ro
      - ./generated/state:/state
    networks: [flowsplice]

  travelagent:
    image: flowsplice-e2e:local
    command: ["/usr/local/bin/flowsplice-travelagent", "--config", "/config/travelagent.toml"]
    environment:
      RUST_LOG: flowsplice_travelagent=debug,info
    depends_on: [relay1, relay2, homeagent]
    ports:
      - "127.0.0.1:19080:9080"
      - "127.0.0.1:11080:10080"
      - "127.0.0.1:11081:10081/udp"
    volumes:
      - ./generated/config:/config:ro
      - ./generated/certs:/certs:ro
    networks: [flowsplice]

networks:
  flowsplice: {}
