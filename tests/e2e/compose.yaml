services:
  echo:
    image: "${FLOWSPLICE_E2E_IMAGE:-flowsplice-e2e:local}"
    user: "${FLOWSPLICE_E2E_UID:-0}:${FLOWSPLICE_E2E_GID:-0}"
    command: ["/usr/local/bin/flowsplice-echo"]
    networks: [flowsplice]

  echo2:
    image: "${FLOWSPLICE_E2E_IMAGE:-flowsplice-e2e:local}"
    user: "${FLOWSPLICE_E2E_UID:-0}:${FLOWSPLICE_E2E_GID:-0}"
    command: ["/usr/local/bin/flowsplice-echo"]
    environment:
      FLOWSPLICE_ECHO_LABEL: home-2
    networks: [flowsplice]

  relay1:
    image: "${FLOWSPLICE_E2E_IMAGE:-flowsplice-e2e:local}"
    user: "${FLOWSPLICE_E2E_UID:-0}:${FLOWSPLICE_E2E_GID:-0}"
    command: ["/usr/local/bin/flowsplice-relay", "--config", "/config/relay.toml"]
    environment:
      RUST_LOG: flowsplice_relay=debug,info
      FLOWSPLICE_E2E_DISCOVERY_DATA_ADDR: "${FLOWSPLICE_E2E_DISCOVERY_DATA_ADDR:-10.0.2.2:${FLOWSPLICE_E2E_PORT_18447:-18447}}"
    volumes:
      - ./generated/config:/config:ro
      - ./generated/certs:/certs:ro
      - ./generated/state:/state
    ports:
      - "127.0.0.1:${FLOWSPLICE_E2E_PORT_18446:-18446}:8443"
      - "127.0.0.1:${FLOWSPLICE_E2E_PORT_18447:-18447}:8444"
    networks: [flowsplice]

  relay2:
    image: "${FLOWSPLICE_E2E_IMAGE:-flowsplice-e2e:local}"
    user: "${FLOWSPLICE_E2E_UID:-0}:${FLOWSPLICE_E2E_GID:-0}"
    command: ["/usr/local/bin/flowsplice-relay", "--config", "/config/relay2.toml"]
    environment:
      RUST_LOG: flowsplice_relay=debug,info
    volumes:
      - ./generated/config:/config:ro
      - ./generated/certs:/certs:ro
      - ./generated/state:/state
    ports:
      - "127.0.0.1:${FLOWSPLICE_E2E_PORT_28446:-28446}:8443"
      - "127.0.0.1:${FLOWSPLICE_E2E_PORT_28447:-28447}:8444"
    networks: [flowsplice]

  server:
    image: "${FLOWSPLICE_E2E_IMAGE:-flowsplice-e2e:local}"
    user: "${FLOWSPLICE_E2E_UID:-0}:${FLOWSPLICE_E2E_GID:-0}"
    command: ["/usr/local/bin/flowsplice-server", "--config", "/config/server.toml"]
    environment:
      RUST_LOG: flowsplice_server=debug,info
    depends_on: [relay1, relay2]
    volumes:
      - ./generated/config:/config:ro
      - ./generated/certs:/certs:ro
      - ./generated/authorization:/authorization
      - ./generated/state:/state
    networks: [flowsplice]

  homeagent:
    image: "${FLOWSPLICE_E2E_IMAGE:-flowsplice-e2e:local}"
    user: "${FLOWSPLICE_E2E_UID:-0}:${FLOWSPLICE_E2E_GID:-0}"
    command: ["/usr/local/bin/flowsplice-homeagent", "--config", "/config/homeagent.toml"]
    environment:
      RUST_LOG: flowsplice_homeagent=debug,info
      FLOWSPLICE_ALLOW_REMOTE_KEY_PASSWORD_ROTATION_TEST_ONLY: "1"
    depends_on: [server, echo]
    volumes:
      - ./generated/config:/config:ro
      - ./generated/certs:/certs:ro
      - ./generated/state:/state
      - ./generated/offline:/issuer
    ports:
      - "127.0.0.1:${FLOWSPLICE_E2E_PORT_19084:-19084}:9081"
    networks: [flowsplice]

  homeagent2:
    image: "${FLOWSPLICE_E2E_IMAGE:-flowsplice-e2e:local}"
    user: "${FLOWSPLICE_E2E_UID:-0}:${FLOWSPLICE_E2E_GID:-0}"
    command: ["/usr/local/bin/flowsplice-homeagent", "--config", "/config/homeagent2.toml"]
    environment:
      RUST_LOG: flowsplice_homeagent=debug,info
      FLOWSPLICE_ALLOW_REMOTE_KEY_PASSWORD_ROTATION_TEST_ONLY: "1"
    depends_on: [server, echo2]
    volumes:
      - ./generated/config:/config:ro
      - ./generated/certs:/certs:ro
      - ./generated/state:/state
      - ./generated/offline-home2:/issuer
    ports:
      - "127.0.0.1:${FLOWSPLICE_E2E_PORT_29084:-29084}:9081"
    networks: [flowsplice]

  homeagent2serving:
    image: "${FLOWSPLICE_E2E_IMAGE:-flowsplice-e2e:local}"
    user: "${FLOWSPLICE_E2E_UID:-0}:${FLOWSPLICE_E2E_GID:-0}"
    command: ["/usr/local/bin/flowsplice-homeagent", "--config", "/config/homeagent2-serving.toml"]
    environment:
      RUST_LOG: flowsplice_homeagent=debug,info
    depends_on: [server, echo2]
    volumes:
      - ./generated/config:/config:ro
      - ./generated/certs:/certs:ro
      - ./generated/state:/state
    networks: [flowsplice]

  dynamichome-serving:
    image: "${FLOWSPLICE_E2E_IMAGE:-flowsplice-e2e:local}"
    user: "${FLOWSPLICE_E2E_UID:-0}:${FLOWSPLICE_E2E_GID:-0}"
    command: ["/usr/local/bin/flowsplice-homeagent", "--config", "/dynamic-home/homeagent.toml"]
    environment:
      RUST_LOG: flowsplice_homeagent=debug,info
      FLOWSPLICE_HOME_INSTALL_DIR: /dynamic-home
    depends_on: [server]
    volumes:
      - ./generated/dynamic-home-serving:/dynamic-home
      - ./generated/config:/config:ro
      - ./generated/certs:/certs:ro
    networks: [flowsplice]

  dynamichome-issuer:
    image: "${FLOWSPLICE_E2E_IMAGE:-flowsplice-e2e:local}"
    user: "${FLOWSPLICE_E2E_UID:-0}:${FLOWSPLICE_E2E_GID:-0}"
    command: ["/usr/local/bin/flowsplice-homeagent", "--config", "/dynamic-home/homeagent.toml"]
    environment:
      RUST_LOG: flowsplice_homeagent=debug,info
      FLOWSPLICE_HOME_INSTALL_DIR: /dynamic-home
    depends_on: [server]
    ports:
      - "127.0.0.1:${FLOWSPLICE_E2E_PORT_39086:-39086}:9082"
    volumes:
      - ./generated/dynamic-home-issuer:/dynamic-home
      - ./generated:/generated:ro
      - ./generated/config:/config:ro
      - ./generated/certs:/certs:ro
    networks: [flowsplice]

  dynamichome-global:
    image: "${FLOWSPLICE_E2E_IMAGE:-flowsplice-e2e:local}"
    user: "${FLOWSPLICE_E2E_UID:-0}:${FLOWSPLICE_E2E_GID:-0}"
    command: ["/usr/local/bin/flowsplice-homeagent", "--config", "/dynamic-home/homeagent.toml"]
    environment:
      RUST_LOG: flowsplice_homeagent=debug,info
      FLOWSPLICE_HOME_INSTALL_DIR: /dynamic-home
    depends_on: [server]
    ports:
      - "127.0.0.1:${FLOWSPLICE_E2E_PORT_39087:-39087}:9082"
    volumes:
      - ./generated/dynamic-home-global:/dynamic-home
      - ./generated:/generated:ro
      - ./generated/config:/config:ro
      - ./generated/certs:/certs:ro
    networks: [flowsplice]

  dynamichome-third:
    image: "${FLOWSPLICE_E2E_IMAGE:-flowsplice-e2e:local}"
    user: "${FLOWSPLICE_E2E_UID:-0}:${FLOWSPLICE_E2E_GID:-0}"
    environment:
      RUST_LOG: flowsplice_homeagent=debug,info
      FLOWSPLICE_HOME_INSTALL_DIR: /dynamic-home
    depends_on: [server]
    volumes:
      - ./generated/dynamic-home-third:/dynamic-home
      - ./generated/config:/config:ro
      - ./generated/certs:/certs:ro
    networks: [flowsplice]

  travelagent:
    image: "${FLOWSPLICE_E2E_TRAVEL_IMAGE:-${FLOWSPLICE_E2E_IMAGE:-flowsplice-e2e:local}}"
    user: "${FLOWSPLICE_E2E_UID:-0}:${FLOWSPLICE_E2E_GID:-0}"
    command: ["/usr/local/bin/flowsplice-travelagent", "--config", "/config/travelagent.toml"]
    environment:
      RUST_LOG: flowsplice_travel_core=debug,flowsplice_travelagent=debug,info
      FLOWSPLICE_ALLOW_TEST_PASSWORD_FILE: "1"
      FLOWSPLICE_TEST_PRIVATE_KEY_PASSWORD_FILE: /travel/test-password.txt
      FLOWSPLICE_ALLOW_REMOTE_KEY_PASSWORD_ROTATION_TEST_ONLY: "1"
    depends_on: [relay1, relay2, homeagent, homeagent2]
    ports:
      - "127.0.0.1:${FLOWSPLICE_E2E_PORT_19083:-19083}:9080"
      - "127.0.0.1:${FLOWSPLICE_E2E_PORT_11083:-11083}:10080"
      - "127.0.0.1:${FLOWSPLICE_E2E_PORT_11084:-11084}:10081/udp"
      - "127.0.0.1:${FLOWSPLICE_E2E_PORT_11085:-11085}:10082"
      - "127.0.0.1:${FLOWSPLICE_E2E_PORT_11086:-11086}:10083"
      - "127.0.0.1:${FLOWSPLICE_E2E_PORT_11087:-11087}:10084"
      - "127.0.0.1:${FLOWSPLICE_E2E_PORT_11088:-11088}:10085"
      - "127.0.0.1:${FLOWSPLICE_E2E_PORT_11089:-11089}:10086"
      - "127.0.0.1:${FLOWSPLICE_E2E_PORT_11090:-11090}:10087"
      - "127.0.0.1:${FLOWSPLICE_E2E_PORT_11091:-11091}:10088"
    volumes:
      - ./generated/config:/config:ro
      - ./generated/certs:/certs:ro
      - ./generated/travel:/travel
      - ./generated/state:/state
    networks: [flowsplice]

  firsttravel:
    image: "${FLOWSPLICE_E2E_TRAVEL_IMAGE:-${FLOWSPLICE_E2E_IMAGE:-flowsplice-e2e:local}}"
    user: "${FLOWSPLICE_E2E_UID:-0}:${FLOWSPLICE_E2E_GID:-0}"
    command: ["/usr/local/bin/flowsplice-travelagent", "--config", "/first-travel/travelagent.toml"]
    environment:
      RUST_LOG: flowsplice_travel_core=debug,flowsplice_travelagent=debug,info
      FLOWSPLICE_ALLOW_TEST_PASSWORD_FILE: "1"
      FLOWSPLICE_TEST_PRIVATE_KEY_PASSWORD_FILE: /first-travel/test-password.txt
    depends_on: [relay1, relay2, homeagent]
    ports:
      - "127.0.0.1:${FLOWSPLICE_E2E_PORT_12083:-12083}:10080"
    volumes:
      - ./generated/first-travel:/first-travel
      - ./generated/config:/config:ro
      - ./generated/certs:/certs:ro
    networks: [flowsplice]

  dynamictravel:
    image: "${FLOWSPLICE_E2E_TRAVEL_IMAGE:-${FLOWSPLICE_E2E_IMAGE:-flowsplice-e2e:local}}"
    user: "${FLOWSPLICE_E2E_UID:-0}:${FLOWSPLICE_E2E_GID:-0}"
    command: ["/usr/local/bin/flowsplice-travelagent", "--config", "/dynamic-travel/travelagent.toml"]
    environment:
      RUST_LOG: flowsplice_travel_core=debug,flowsplice_travelagent=debug,info
      FLOWSPLICE_ALLOW_TEST_PASSWORD_FILE: "1"
      FLOWSPLICE_TEST_PRIVATE_KEY_PASSWORD_FILE: /dynamic-travel/test-password.txt
    depends_on: [relay1, relay2, homeagent, dynamichome-global]
    ports:
      - "127.0.0.1:${FLOWSPLICE_E2E_PORT_13083:-13083}:10080"
    volumes:
      - ./generated/dynamic-travel:/dynamic-travel
      - ./generated/config:/config:ro
      - ./generated/certs:/certs:ro
    networks: [flowsplice]

networks:
  flowsplice: {}
