[package]
name = "flowsplice-compression-bench"
version = "0.1.0"
edition = "2024"
publish = false

# An isolated experiment: no production workspace dependency changes.
[workspace]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

