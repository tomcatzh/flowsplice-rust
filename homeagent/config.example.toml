id = "home-1"
alias = "My Home"
server_control_addr = "127.0.0.1:7443"
server_data_addr = "127.0.0.1:7444"
server_name = "server.home.example"
server_id = "server-1"
management_cert = "/etc/flowsplice/home-management.crt"
management_key = "/etc/flowsplice/home-management.key"
management_ca = "/etc/flowsplice/management-ca.crt"
business_cert = "/etc/flowsplice/home-business.crt"
business_key = "/etc/flowsplice/home-business.key"
business_ca = "/etc/flowsplice/business-ca.crt"
server_spki_pins = ["replace-with-server-spki-sha256-hex"]
travel_authorization_cache = "/var/lib/flowsplice/home-authorization-cache.json"
handshake_timeout_secs = 10
udp_idle_secs = 60
max_active_flows = 128
carrier_heartbeat_secs = 5
carrier_timeout_secs = 30
flow_detach_timeout_secs = 120
max_unacked_bytes = 1048576

[[travel_authorities]]
kind = "home"
id = "home-1-authority"
home_id = "home-1"
public_key = "replace-with-uncompressed-p256-public-key-hex"

[[travel_authorities]]
kind = "global"
id = "operator-global-authority"
home_id = "home-1"
public_key = "replace-with-global-uncompressed-p256-public-key-hex"

[issuer]
listen = "127.0.0.1:9081"
management_ca_cert = "/etc/flowsplice/issuer/management-ca.crt"
management_ca_key = "/etc/flowsplice/issuer/management-ca.key"
business_ca_cert = "/etc/flowsplice/issuer/business-ca.crt"
business_ca_key = "/etc/flowsplice/issuer/business-ca.key"
default_valid_days = 365

[issuer.home_authority]
id = "home-1-authority"
public_key = "replace-with-uncompressed-p256-public-key-hex"
private_key = "/etc/flowsplice/issuer/home-authority.key"

[issuer.global_authority]
id = "operator-global-authority"
public_key = "replace-with-global-uncompressed-p256-public-key-hex"
private_key = "/etc/flowsplice/issuer/global-authority.key"

[[services]]
id = "ssh"
alias = "Home SSH"
protocol = "tcp"
target = "127.0.0.1:22"
