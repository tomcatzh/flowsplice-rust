id = "server-1"
control_listen = "192.0.2.10:7443"
cert = "/etc/flowsplice/server.crt"
key = "/etc/flowsplice/server.key"
management_ca = "/etc/flowsplice/management-ca.crt"
deployment_root_public_key = "/etc/flowsplice/deployment-root.pub"
deployment_trust = "/etc/flowsplice/deployment-trust.json"
control_signing_key = "/etc/flowsplice/server-control.key"
travel_authorization_state = "/var/lib/flowsplice/server-authorization.json"
control_generation_state = "/var/lib/flowsplice/server-control-generation.json"
state_store = "/var/lib/flowsplice/server-state.redb"
ui_listen = "127.0.0.1:9083"
handshake_timeout_secs = 10
work_ttl_secs = 15
max_pending_work = 256
control_snapshot_ttl_secs = 120
max_control_connections = 256

[[homes]]
id = "home-1"

[[homes]]
id = "home-2"

[[relays]]
id = "relay-1"
connection_mode = "passive"
connect_addr = "192.0.2.20:8443"

[[relays]]
id = "relay-2"
connection_mode = "active"
