[package]
publish = false
name = "flowsplice-pty-codec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
encode = []

[build-dependencies]
cmake = "=0.1.58"
cc = "=1.4.3"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
