<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FlowSplice Direction A — Native Utility</title>
  <link rel="stylesheet" href="prototype.css">
  <style>
    :root{--accent:#087d63;--accent-text:#fff;--app-bg:#f2f2f7;--surface:#fff;--soft:#e8f5f1;--sidebar:rgba(246,246,250,.92);--selection:#dceee9;--bar:rgba(250,250,252,.9);--text:#101211;--secondary:#666b69;--tertiary:#a5aaa8;--hairline:rgba(0,0,0,.1);--muted:#5e6461;--good:#1c9b68;--indicator:rgba(0,0,0,.28)}
    body{background:#e8ebe9}.board{background:radial-gradient(circle at 78% 43%,#f7faf8 0,#e8ebe9 58%)}
    .phone-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.enroll-callout{background:#07110f;color:#fff;padding:18px;border-radius:20px;margin-bottom:14px}.enroll-callout p{color:#afbbb7;font-size:13px;line-height:1.35;margin:6px 0 0}.fields{display:grid;gap:9px}.enroll-actions{display:grid;gap:9px;margin-top:13px}.detail .hero{display:flex;align-items:center;gap:18px}.status-orb{width:62px;height:62px;border-radius:50%;background:#dff6ed;display:grid;place-items:center;border:1px solid #b9e6d6}.status-orb:after{content:"✓";width:31px;height:31px;border-radius:50%;background:#16835b;color:white;display:grid;place-items:center;font-weight:850}.hero-copy{flex:1}.hero-copy h2{font-size:26px;letter-spacing:-.03em;margin:2px 0 4px}.wide-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.wide-grid .card{padding:16px}.mapping-list{margin-top:14px;overflow:hidden}.mapping-list .list-row{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center}.note{margin-top:14px;padding:13px 15px;border-radius:14px;background:#fff8df;color:#775f14;font-size:13px;display:flex;gap:10px}
  </style>
</head>
<body>
  <main class="board">
    <section class="brief">
      <div class="eyebrow">方向 A · Native Utility</div>
      <h1>像系统工具一样可靠</h1>
      <p>以 iOS 设置与网络工具的熟悉结构为核心。注册表单清楚、状态克制、iPad 信息密度高，最少学习成本。</p>
      <div class="traits">
        <div class="trait">最强项：可信、清晰、容易测试</div>
        <div class="trait">iPhone：单列 Tab + 系统表单</div>
        <div class="trait">iPad：原生侧边栏 + 状态详情</div>
      </div>
    </section>

    <section class="stage phone-stage">
      <div data-ios-frame data-device="iphone" data-time="9:41" data-battery="88">
        <template>
          <div class="app-shell">
            <section class="screen-pad" data-panel="enroll">
              <div class="phone-head"><span class="nav-title">注册设备</span><img class="brand-icon" src="../../../assets/brand/flowsplice-icon.svg" alt="FlowSplice"></div>
              <div class="enroll-callout"><strong>连接到你的 Home</strong><p>密钥只在这台 iPhone 上生成。Home 批准后会自动完成。</p></div>
              <div class="fields">
                <div class="field"><small>Travel ID</small><span>Tomcat-iPhone</span></div>
                <div class="field"><small>Home ID</small><span>home-1</span></div>
                <div class="field"><small>Relay 地址</small><span>relay.example.net:8443</span></div>
                <div class="field"><small>私钥密码</small><span>••••••••••••••••</span></div>
                <div class="field"><small>确认密码</small><span>••••••••••••••••</span></div>
              </div>
              <div class="enroll-actions"><button class="native-button">开始注册</button><span class="caption" style="text-align:center">密码将安全存入钥匙串</span></div>
            </section>
            <section class="screen-pad" data-panel="overview" hidden>
              <div class="phone-head"><span class="nav-title">概览</span><img class="brand-icon" src="../../../assets/brand/flowsplice-icon.svg" alt="FlowSplice"></div>
              <div class="card hero"><div class="row space"><span class="pill"><i class="dot"></i>已连接</span><button class="secondary-button">停止</button></div><h2 style="margin:14px 0 3px">Tomcat-iPhone</h2><span class="caption">已运行 2 小时 18 分</span></div>
              <div class="metric-grid" style="margin-top:10px"><div class="card metric"><span class="label">上传</span><strong>38 MB</strong></div><div class="card metric"><span class="label">下载</span><strong>412 MB</strong></div><div class="card metric"><span class="label">流</span><strong>3</strong></div></div>
            </section>
            <nav class="tabbar"><button class="tab selected" data-screen="enroll"><b>⌁</b>设备</button><button class="tab" data-screen="overview"><b>◉</b>概览</button></nav>
          </div>
        </template>
      </div>
    </section>

    <section class="stage ipad-stage">
      <div data-ios-frame data-device="ipad" data-time="9:41" data-battery="94">
        <template>
          <div class="app-shell split">
            <aside class="sidebar">
              <div class="side-brand"><img class="brand-icon" src="../../../assets/brand/flowsplice-icon.svg" alt="FlowSplice">FlowSplice</div>
              <button class="side-item selected" data-screen="overview"><span class="sf">◉</span>概览</button>
              <button class="side-item" data-screen="mappings"><span class="sf">↔</span>本地映射</button>
              <button class="side-item" data-screen="enrollment"><span class="sf">⌁</span>设备注册</button>
              <button class="side-item" data-screen="diagnostics"><span class="sf">⋯</span>诊断</button>
              <div style="margin-top:auto;padding:18px 11px" class="caption"><span class="pill"><i class="dot"></i>Relay 正常</span></div>
            </aside>
            <section class="detail" data-panel="overview">
              <div class="toolbar"><div><div class="nav-title">概览</div><span class="caption">Tomcat-iPad-mini</span></div><button class="secondary-button">停止 Travel</button></div>
              <div class="card hero" style="margin-top:16px"><div class="status-orb"></div><div class="hero-copy"><span class="pill"><i class="dot"></i>在线</span><h2>已连接到 Home</h2><span class="caption">2 个 Relay · 已运行 02:18:42</span></div></div>
              <div class="wide-grid"><div class="card"><span class="label">本次流量</span><div class="row space" style="margin-top:12px"><span>上传 <b>38.2 MB</b></span><span>下载 <b>412 MB</b></span></div></div><div class="card"><span class="label">连接</span><div class="row space" style="margin-top:12px"><span>活动流 <b>3</b></span><span>服务 <b>4</b></span></div></div></div>
              <div class="row space" style="margin:20px 2px 9px"><span class="section-title">本地映射</span><button class="native-button">＋ 添加映射</button></div>
              <div class="card mapping-list"><div class="list-row"><span class="service-mark">S</span><span><b>Desktop Shell</b><small class="caption" style="display:block">Primary Home · TCP</small></span><span class="pill">127.0.0.1:1080</span></div><div class="list-row"><span class="service-mark">E</span><span><b>Echo</b><small class="caption" style="display:block">Second Home · UDP</small></span><span class="pill">127.0.0.1:9000</span></div></div>
              <div class="note"><b>↻</b><span>网络在 9:37 切换；Travel 已自动重连，现有映射保持不变。</span></div>
            </section>
            <section class="detail" data-panel="mappings" hidden><div class="toolbar"><div class="nav-title">本地映射</div><button class="native-button">＋ 添加映射</button></div><div class="card mapping-list"><div class="list-row"><span class="service-mark">S</span><span><b>Desktop Shell</b><small class="caption" style="display:block">Primary Home · TCP</small></span><span class="pill">127.0.0.1:1080</span></div><div class="list-row"><span class="service-mark">E</span><span><b>Echo</b><small class="caption" style="display:block">Second Home · UDP</small></span><span class="pill">127.0.0.1:9000</span></div></div></section>
            <section class="detail" data-panel="enrollment" hidden><div class="nav-title">设备注册</div><div class="card" style="padding:20px;margin-top:16px"><span class="pill"><i class="dot"></i>已安装</span><h2>Tomcat-iPad-mini</h2><p class="label">证书与私钥安全保存在此设备。</p></div></section>
            <section class="detail" data-panel="diagnostics" hidden><div class="nav-title">诊断</div><div class="card" style="padding:20px;margin-top:16px"><b>最近事件</b><p class="label">09:37 网络路径改变<br>09:37 Relay 重连成功<br>09:38 业务目录已刷新</p></div></section>
          </div>
        </template>
      </div>
    </section>
  </main>
  <script src="prototype.js"></script>
</body>
</html>
