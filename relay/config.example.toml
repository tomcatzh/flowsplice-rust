id = "relay-1"
management_listen = "0.0.0.0:8443"
data_listen = "0.0.0.0:8444"
data_public_addr = "relay.example.net:8444"
server_id = "server-1"
cert = "/etc/flowsplice/relay.crt"
key = "/etc/flowsplice/relay.key"
management_ca = "/etc/flowsplice/management-ca.crt"
deployment_root_public_key = "/etc/flowsplice/deployment-root.pub"
deployment_trust = "/etc/flowsplice/deployment-trust.json"
server_spki_pins = ["replace-with-server-spki-sha256-hex"]
travel_authorization_cache = "/var/lib/flowsplice/relay-authorization-cache.json"
# After validating a new Relay config, create this once with:
# flowsplice-relay --config /etc/flowsplice/relay.toml --initialize-authorization-state
# Never recreate a lost live cache; restore the matching backup instead.
state_store = "/var/lib/flowsplice/relay-state.redb"
ui_listen = "127.0.0.1:9084"
handshake_timeout_secs = 10
route_ttl_secs = 15
max_pending_routes = 256
max_management_connections = 1024
max_data_connections = 2048
