id = "travel-1"
deployment_root_public_key = "/etc/flowsplice/deployment-root.pub"
deployment_trust = "/etc/flowsplice/deployment-trust.json"
management_cert = "/etc/flowsplice/travel-management.crt"
management_key = "/etc/flowsplice/travel-management.key"
management_ca = "/etc/flowsplice/management-ca.crt"
business_cert = "/etc/flowsplice/travel-business.crt"
business_key = "/etc/flowsplice/travel-business.key"
business_ca = "/etc/flowsplice/business-ca.crt"
state_store = "/var/lib/flowsplice/travel-state.redb"
enrollment_work_dir = "/var/lib/flowsplice/enrollment"
ui_listen = "127.0.0.1:9080"
handshake_timeout_secs = 10
udp_idle_secs = 60
max_active_flows = 128
carrier_heartbeat_secs = 2
carrier_timeout_secs = 8
carrier_race_timeout_secs = 10
carrier_recovery_timeout_secs = 90
carrier_reevaluate_secs = 60
max_carrier_reevaluate_secs = 900
max_unacked_bytes = 1048576
max_active_carriers = 512
max_carriers_per_flow = 16

[[homes]]
id = "home-1"

[[homes]]
id = "home-2"

[[seed_relays]]
management_addr = "relay-1.example.net:8443"

# Create and change business listeners in the local Travel Web page. They are saved in state_store
# and take effect without a process restart. Legacy [[mappings]] entries are imported once when an
# older 0.2 development installation first starts with this version.
